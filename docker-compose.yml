version: '3.8'

services:
  backend:
    build: ./mnemosyne-core
    container_name: mnemosyne-backend
    volumes:
      - ./mnemosyne-core/data:/app/data
      - whisper_cache:/root/.cache/whisper
      - clip_cache:/root/.cache/huggingface
    env_file:
      - ./mnemosyne-core/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mnemosyne-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  whisper_cache:
  clip_cache:
